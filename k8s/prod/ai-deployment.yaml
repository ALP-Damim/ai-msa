apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-prod
  labels:
    app: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai
          image: YOUR_REGISTRY/msa-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ai-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-prod
spec:
  selector:
    app: ai-service
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

